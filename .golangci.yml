# golangci-lint 配置（CI 与本地 make lint 共用）。
# 起点刻意收敛到高价值、低误报的 linter，避免存量代码大面积红灯；
# 后续按需扩面（见 CONTRIBUTING §7 质量门禁）。
version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    generated: lax
    paths:
      - internal/providers/wire_gen\.go
      - internal/router/wire_gen\.go
    rules:
      - linters: [errcheck]
        path: _test\.go$
        text: "Error return value of .* is not checked"
