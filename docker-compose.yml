version: '3.3'

# 默认：MySQL 在宿主机（非容器），仅启动 redis + backend + frontend。
# 若要用容器 MySQL：docker-compose --profile container-mysql up -d
services:
  mysql:
    profiles: ["container-mysql"]
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:5.7.22
    container_name: yunshu-mysql
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.6
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-YunshuDB@2026Secure!}"
      MYSQL_DATABASE: yunshu
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - /export/mysql_data:/var/lib/mysql:Z
      - ./configs/yunshu_full_20260507.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=50
      - --innodb-buffer-pool-size=64M
      - --skip-name-resolve
    networks:
      - yunshu-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7.4.2-alpine
    container_name: yunshu-redis
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.3
    environment:
      - TZ=Asia/Shanghai
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:-YunshuRedis@2026Secure!}"
      - --maxmemory
      - "96mb"
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
      - --tcp-backlog
      - "511"
      - --databases
      - "4"
    ports:
      - 6379:6379
    volumes:
      - /export/redis_data:/data
    networks:
      - yunshu-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-YunshuRedis@2026Secure!}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: yunshu-backend
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.6
    ports:
      - "8080:8080"
      - "18080:18080"
    extra_hosts:
      # Linux 下让容器访问宿主机 MySQL（同机非容器部署）
      - "host.docker.internal:host-gateway"
    environment:
      - GIN_MODE=release
      - APP_ENV=prod
      - TZ=Asia/Shanghai
      # 宿主机 MySQL：默认 host.docker.internal；也可在 .env 设 MYSQL_HOST=10.10.10.4
      - MYSQL_HOST=${MYSQL_HOST:-host.docker.internal}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:-YunshuDB@2026Secure!}}
      - MYSQL_DB_NAME=${MYSQL_DB_NAME:-yunshu}
      - REDIS_ADDR=yunshu-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-YunshuRedis@2026Secure!}
      - JWT_SECRET=${JWT_SECRET:-YunshuJWTSecretKey2026ChangeInProduction}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-32bytes-base64}
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - yunshu-network

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.frontend
    container_name: yunshu-frontend
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.2
    environment:
      - TZ=Asia/Shanghai
    ports:
      # 宿主机 80 已被 Harbor 占用，yunshu 前端改用 8083
      - "8083:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - yunshu-network

networks:
  yunshu-network:
    driver: bridge
