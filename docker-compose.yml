version: '3.3'

# 默认：MySQL 在宿主机（非容器），仅启动 redis + backend + frontend。
# 若要用容器 MySQL：docker-compose --profile container-mysql up -d
#
# 构建提示：
#   1) 确保仓库根目录有 .dockerignore（否则 context 可达数百 MB）
#   2) 可选开启 BuildKit（非必须）：export DOCKER_BUILDKIT=1
services:
  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7.4.2-alpine
    container_name: yunshu-redis
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.3
    environment:
      - TZ=Asia/Shanghai
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:-YunshuRedis@2026Secure!}"
      - --maxmemory
      - "96mb"
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
      - --tcp-backlog
      - "511"
      - --databases
      - "4"
    ports:
      - 6379:6379
    volumes:
      - /export/redis_data:/data
    networks:
      - yunshu-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-YunshuRedis@2026Secure!}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        # 华为云镜像路径为 docker.io/library/...（不是 docker.io/golang）
        GO_IMAGE: ${GO_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/golang:1.26.2-alpine}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/alpine:3.19}
    container_name: yunshu-backend
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.6
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - APP_ENV=prod
      - TZ=Asia/Shanghai
      # 宿主机 MySQL：旧 compose 不支持 host-gateway，默认走 docker0 网关；请在 .env 覆盖为实际 IP
      - MYSQL_HOST=${MYSQL_HOST:-172.17.0.1}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-YunshuDB@2026Secure!}
      - MYSQL_DB_NAME=${MYSQL_DB_NAME:-yunshu}
      - REDIS_ADDR=yunshu-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-YunshuRedis@2026Secure!}
      - JWT_SECRET=${JWT_SECRET:-YunshuJWTSecretKey2026ChangeInProduction}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-32bytes-base64}
      - RUN_SEED=${RUN_SEED:-1}
      - WAIT_MYSQL=${WAIT_MYSQL:-1}
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - yunshu-network
    # 旧版 docker-compose 不支持 extra_hosts: host-gateway。
    # 连宿主机 MySQL 请在 .env 设 MYSQL_HOST 为宿主机 IP（如 10.10.10.4），不要用 host.docker.internal。

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.frontend
    container_name: yunshu-frontend
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.2
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8083:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - yunshu-network

networks:
  yunshu-network:
    driver: bridge
