version: '3.3'

# 默认：MySQL 在宿主机（非容器），仅启动 redis + backend + frontend。
# 若要用容器 MySQL：docker-compose --profile container-mysql up -d
#
# 配置唯一入口：configs/config.yaml（挂载到容器 /app/configs）
#   启动前请按该文件顶部「场景速查」改 mysql/redis/密钥/app.env。
#   不要依赖 .env / .env.example。
#
# Redis 密码必须与 config.yaml → redis.password 完全一致（下方 --requirepass）。
#
# 构建提示：
#   1) 确保仓库根目录有 .dockerignore（否则 context 可达数百 MB）
#   2) 可选开启 BuildKit：export DOCKER_BUILDKIT=1
services:
  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7.4.2-alpine
    container_name: yunshu-redis
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.3
    environment:
      - TZ=Asia/Shanghai
    command:
      - redis-server
      # 与 configs/config.yaml redis.password 保持一致后改此处
      - --requirepass
      - "1234"
      - --maxmemory
      - "96mb"
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
      - --tcp-backlog
      - "511"
      - --databases
      - "4"
    ports:
      - 6379:6379
    volumes:
      - /export/redis_data:/data
    networks:
      - yunshu-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "1234", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        # 华为云镜像路径为 docker.io/library/...（不是 docker.io/golang）
        GO_IMAGE: ${GO_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/golang:1.26.2-alpine}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/alpine:3.19}
        WKHTMLTOPDF_IMAGE: ${WKHTMLTOPDF_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/surnet/alpine-wkhtmltopdf:3.23.2-0.12.6-full}
    container_name: yunshu-backend
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.6
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
      # 业务配置全部来自挂载的 configs/config.yaml（含 JWT / encryption_key / mysql / redis）
      - RUN_SEED=${RUN_SEED:-1}
      - WAIT_MYSQL=${WAIT_MYSQL:-1}
      - INSPECT_SERVER_PDF=${INSPECT_SERVER_PDF:-html_only}
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - yunshu-network
    # 旧版 docker-compose 不支持 extra_hosts: host-gateway。
    # 连宿主机 MySQL：在 config.yaml 设 mysql.host 为宿主机 IP（如 10.10.10.4 / 172.17.0.1）。

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.frontend
    container_name: yunshu-frontend
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.2
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8083:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - yunshu-network


networks:
  yunshu-network:
    driver: bridge
