# 请改成实际 ES 地址/账号；或由 Yunshu「K8s 引导」按 config 自动生成。
apiVersion: loggie.io/v1beta1
kind: Sink
metadata:
  name: yunshu-es
  namespace: loggie
  labels:
    yunshu.project_id: "1"
spec:
  sink: |
    type: elasticsearch
    hosts:
      - http://10.10.10.5:9200
    index: yunshu-logs-${+YYYY.MM.DD}
    username: "elastic"
    password: "changeme"
