# 联调：pod-template-hash:* + stdout + 显式 regex codec（解 CRI）。
# 重要：Helm values 里 discovery.kubernetes.parseStdout 必须为 false。
# 若 parseStdout:true，Loggie 会再注入 codec，易出现 Config.Pattern required。
apiVersion: loggie.io/v1beta1
kind: ClusterLogConfig
metadata:
  name: yunshu-p1-container-logs
  labels:
    yunshu.project_id: "1"
spec:
  selector:
    type: pod
    labelSelector:
      "pod-template-hash": "*"
  pipeline:
    sources: |
      - type: file
        name: container-logs
        containerName: "*"
        paths:
          - stdout
        addonMeta: true
        codec:
          type: regex
          pattern: '^(?P<time>\S+)\s+(?P<stream>stdout|stderr)\s+(?P<logtag>\S)\s+(?P<log>.*)$'
          bodyFields: log
    sinkRef: yunshu-es
    interceptors: |
      - type: addK8sMeta
        addFields:
          project_id: "1"
          namespace: "${namespace}"
          pod: "${pod.name}"
          container: "${container.name}"
