# 示例：采集带 yunshu.project_id=1 的 Pod stdout，并固定写入 project_id=1。
# labelSelector 必须是 map（如 app: nginx），不支持 matchExpressions。
# sinkRef 引用 Sink CR；不要写 sink: yunshu-es。
apiVersion: loggie.io/v1beta1
kind: ClusterLogConfig
metadata:
  name: yunshu-p1-container-logs
  labels:
    yunshu.project_id: "1"
spec:
  selector:
    type: pod
    labelSelector:
      "yunshu.project_id": "1"
  pipeline:
    sources: |
      - type: file
        name: container-logs
        containerName: "*"
        paths:
          - /var/log/pods/*/*/*.log
        addonMeta: true
    sinkRef: yunshu-es
    interceptors: |
      - type: addK8sMeta
        addFields:
          project_id: "1"
          server_id: "${pod.labels.yunshu\\.server_id}"
          service_id: "${pod.labels.yunshu\\.service_id}"
          log_source_id: "${pod.labels.yunshu\\.log_source_id}"
          namespace: "${namespace}"
          pod: "${pod.name}"
          container: "${container.name}"
      - type: transformer
        actions:
          - action: copy(state.filename, file_path)
            ignoreError: true
          - action: regex(body)
            pattern: '^(?P<ts>\S+)\s+(?P<stream>stdout|stderr)\s+(?P<flag>\S)\s+(?P<message>.*)$'
            ignoreError: true
