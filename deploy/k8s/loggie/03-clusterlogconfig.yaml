# 示例（联调默认）：采集集群内全部 Pod stdout，固定写入 project_id=1。
# 生产多项目共集群时请增加 labelSelector（见下方注释），并给业务 Pod 打标。
#
# sinkRef 引用 Sink CR；不要写 sink: yunshu-es。
# labelSelector 必须是 map，不支持 matchExpressions。
apiVersion: loggie.io/v1beta1
kind: ClusterLogConfig
metadata:
  name: yunshu-p1-container-logs
  labels:
    yunshu.project_id: "1"
spec:
  selector:
    type: pod
    # 生产建议打开：
    # labelSelector:
    #   "yunshu.project_id": "1"
  pipeline:
    sources: |
      - type: file
        name: container-logs
        containerName: "*"
        paths:
          - /var/log/pods/*/*/*.log
        addonMeta: true
    sinkRef: yunshu-es
    interceptors: |
      - type: addK8sMeta
        addFields:
          project_id: "1"
          server_id: "${pod.labels.yunshu\\.server_id}"
          service_id: "${pod.labels.yunshu\\.service_id}"
          log_source_id: "${pod.labels.yunshu\\.log_source_id}"
          namespace: "${namespace}"
          pod: "${pod.name}"
          container: "${container.name}"
      - type: transformer
        actions:
          - action: copy(state.filename, file_path)
            ignoreError: true
          - action: regex(body)
            pattern: '^(?P<ts>\S+)\s+(?P<stream>stdout|stderr)\s+(?P<flag>\S)\s+(?P<message>.*)$'
            ignoreError: true
