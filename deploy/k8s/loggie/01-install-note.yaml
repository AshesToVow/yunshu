# Loggie DaemonSet 请用官方 Helm 部署（本仓库只提供 Sink / ClusterLogConfig）。
#
# 参考：https://loggie-io.github.io/docs/getting-started/install/kubernetes/
#
#   VERSION=v1.4.0
#   helm pull ... && tar xvzf loggie-$VERSION.tgz && cd loggie
#   # values.yaml 关键（与 Yunshu 清单配套）：
#   #   config.loggie.discovery.kubernetes.containerRuntime: containerd
#   #   config.loggie.discovery.kubernetes.parseStdout: false   # 勿改为 true
#   helm upgrade --install loggie ./ -n loggie --create-namespace
#
# 然后 Apply Sink + ClusterLogConfig（控制台「K8s 引导」或本目录 yaml）。
