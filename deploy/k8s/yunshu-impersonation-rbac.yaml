# Yunshu Impersonation 统一 RBAC 模板
#
# 适用：仅当「集群管理」中开启 Impersonation 时。
# 未开启时：只需在 Yunshu 平台做集群授权，不必 apply 本文件。
#
# Yunshu 发出的身份（前缀默认 yunshu:，可在集群编辑中修改，须与本 YAML 一致）：
#   User:   yunshu:<平台用户名>          例：yunshu:admin
#   Groups: yunshu:authenticated
#           yunshu:role:<平台角色码>     例：yunshu:role:super-admin
#
# 使用：
#   1. 全文搜索 REPLACE_ 并替换为实际值
#   2. kubectl apply -f deploy/k8s/yunshu-impersonation-rbac.yaml
#   3. 将下方「网关 SA」的 kubeconfig / Token 填入 Yunshu 集群「可写凭证」
#   4. 自检：
#      kubectl --as=yunshu:admin \
#        --as-group=yunshu:authenticated \
#        --as-group=yunshu:role:super-admin get ns
#
---
############################
# 0) 命名空间 + 网关 ServiceAccount
############################
apiVersion: v1
kind: Namespace
metadata:
  name: yunshu-system
  labels:
    app.kubernetes.io/name: yunshu
    app.kubernetes.io/component: gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: yunshu-gateway
  namespace: yunshu-system
  labels:
    app.kubernetes.io/name: yunshu
    app.kubernetes.io/component: gateway
---
############################
# 1) 网关 SA：Impersonate + 最小连通性探测（「连接测试」不带 --as）
############################
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yunshu-gateway-impersonator
  labels:
    app.kubernetes.io/name: yunshu
rules:
  - apiGroups: [""]
    resources: ["users", "groups", "serviceaccounts"]
    verbs: ["impersonate"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["userextras/*"]
    verbs: ["impersonate"]
  # 平台「连接测试」/心跳使用网关身份（不伪装），须能读版本与列举命名空间
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/version", "/healthz", "/livez", "/readyz"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yunshu-gateway-impersonator
  labels:
    app.kubernetes.io/name: yunshu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: yunshu-gateway-impersonator
subjects:
  - kind: ServiceAccount
    name: yunshu-gateway
    namespace: yunshu-system
---
############################
# 2) 业务 ClusterRole（按需裁剪；默认两档）
############################
# 2a) 只读：列表/详情/日志足够（不含 delete/patch/create）
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yunshu-console-readonly
  labels:
    app.kubernetes.io/name: yunshu
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["*"]
    verbs: ["get"]
---
# 2b) 运维：控制台常见变更（不含 Secrets 明文滥用时可再收紧）
# 生产若要求「等同 kubectl 全权限」，可直接绑 cluster-admin，删掉本 Role。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yunshu-console-admin
  labels:
    app.kubernetes.io/name: yunshu
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
---
############################
# 3) 按平台角色 Group 绑定（推荐，一次覆盖一类人）
############################
# 平台角色码 super-admin → 控制台管理员
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yunshu-group-super-admin
  labels:
    app.kubernetes.io/name: yunshu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # 更严：yunshu-console-admin；更宽：cluster-admin
  name: yunshu-console-admin
subjects:
  - kind: Group
    name: yunshu:role:super-admin
    apiGroup: rbac.authorization.k8s.io
---
# 可选：其他平台角色（按你们 seed / 角色管理中的 Code 增删）
# 例：角色码 ops → 管理员；角色码 viewer → 只读
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yunshu-group-ops
  labels:
    app.kubernetes.io/name: yunshu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: yunshu-console-admin
subjects:
  - kind: Group
    name: yunshu:role:ops
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yunshu-group-viewer
  labels:
    app.kubernetes.io/name: yunshu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: yunshu-console-readonly
subjects:
  - kind: Group
    name: yunshu:role:viewer
    apiGroup: rbac.authorization.k8s.io
---
############################
# 4) 按单用户绑定（可选；平台用户名 = admin 时为 yunshu:admin）
############################
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRoleBinding
# metadata:
#   name: yunshu-user-REPLACE_USERNAME
# roleRef:
#   apiGroup: rbac.authorization.k8s.io
#   kind: ClusterRole
#   name: yunshu-console-admin
# subjects:
#   - kind: User
#     name: yunshu:REPLACE_USERNAME
#     apiGroup: rbac.authorization.k8s.io
---
############################
# 5) 网关 Token（Kubernetes ≥1.24 无自动 Secret，需显式建）
#    拿到 token 后写入 Yunshu 集群直连 Token，或生成 kubeconfig。
############################
apiVersion: v1
kind: Secret
metadata:
  name: yunshu-gateway-token
  namespace: yunshu-system
  annotations:
    kubernetes.io/service-account.name: yunshu-gateway
  labels:
    app.kubernetes.io/name: yunshu
type: kubernetes.io/service-account-token
