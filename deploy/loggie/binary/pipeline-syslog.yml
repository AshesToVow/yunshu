# syslog 示例（/var/log/messages 等）
# 分体启动时仅保留 pipelines 段写入 pipelines.yml

pipelines:
  - name: yunshu-syslog
    sources:
      - type: file
        name: syslog
        paths:
          - /var/log/messages
        fields:
          project_id: "1"
          server_id: "10"
        multiline:
          pattern: '^\w{3}\s+\d{1,2}\s+'
          negate: true
          match: after
    interceptors:
      - type: transformer
        actions:
          # Jul 13 18:13:09 host program[pid]: message
          - action: regex(body)
            pattern: '^(?P<ts>\w+\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?P<host>\S+)\s+(?P<message>.*)$'
            ignoreError: true
    sink:
      type: elasticsearch
      hosts:
        - http://10.10.10.103:9200
      index: yunshu-logs-${+YYYY.MM.DD}
      codec:
        type: json
        beatsFormat: true
