# 同步到共享库 k8s-skywalking-*.yaml / k8s-basic-*.yaml 的 containers[].env。
# APOLLO_META 可含多个逗号分隔地址，value 必须用双引号包裹整段。

env:
  - name: JAVA_OPTS
    value: "{{JAVA_OPTS}}"
  - name: APOLLO_OPTS
    value: "-Denv={{APOLLO_ENV}} -Dapollo.meta={{APOLLO_META}} -Dapollo.bootstrap.namespaces={{APOLLO_NAMESPACES}} {{APOLLO_OPTS}}"
  # 也可拆成独立系统属性（与上面二选一即可）：
  # - name: ENV
  #   value: "{{APOLLO_ENV}}"
  # - name: APOLLO_META
  #   value: "{{APOLLO_META}}"
  # - name: APOLLO_BOOTSTRAP_NAMESPACES
  #   value: "{{APOLLO_NAMESPACES}}"
