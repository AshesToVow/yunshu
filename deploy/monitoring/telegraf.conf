# Telegraf 主机采集样例（与 Yunshu 巡检 / 告警 Telegraf 模板对齐）
# 输出：prometheus_client，由 Prometheus（Consul SD）拉取
# 可选：向 Consul 注册，便于统一发现

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "30s"
  hostname = ""
  omit_hostname = false

# ---------- 主机基础 ----------
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.net]]

[[inputs.system]]

[[inputs.processes]]

# ---------- 中间件示例（按需打开，并在服务器安装对应 input）----------
# [[inputs.mysql]]
#   servers = ["user:pass@tcp(127.0.0.1:3306)/"]

# [[inputs.redis]]
#   servers = ["tcp://127.0.0.1:6379"]

# ---------- 输出：供 Prometheus scrape ----------
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  path = "/metrics"
  expiration_interval = "60s"

# ---------- 可选：注册到 Consul（需本机可访问 Consul HTTP API）----------
# 也可用独立 JSON 注册：consul-service-telegraf.json + consul services register
# [[outputs.http]]
#   ## 仅作示例；生产更推荐用 consul agent service register 或配置管理下发
#   url = "http://consul.service.consul:8500/v1/agent/service/register"
#   method = "PUT"
#   data_format = "json"
#   ...

# 全局标签（会进时序；也可只在 Consul meta，由 Prom relabel 写入）
[global_tags]
  exporter_role = "telegraf"
  # yunshu_project = "demo"
  # env = "prod"
