apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-consul-register
  namespace: yunshu-monitor
---
# 监听 Pod 事件并读 ConfigMap / Secret
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-consul-register
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-consul-register
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-consul-register
subjects:
  - kind: ServiceAccount
    name: kube-consul-register
    namespace: yunshu-monitor
