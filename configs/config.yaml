app:
  name: yunshu-cmdb
  env: dev
  port: 8080

# 业务插件（GVA 风格）：按需启停模块；空 enabled 表示启用默认全集。
plugins:
  enabled:
    - core
    - k8s
    - alert
    - project
    - cmdb
    - backup
    - cicd
    - dbmgmt

# 数据库管理（字典 dbmgmt_* 可覆盖）
dbmgmt:
  query_timeout_seconds: 30
  max_result_rows: 1000
  max_import_file_mb: 10
  prod_force_approval: true
  approval_sla_hours: 24
  approval_reminder_interval_hours: 4
  allowed_drivers: [mysql, postgres]
  ping_interval_seconds: 300
  max_concurrent_per_instance: 5
  goinception_enabled: true
  goinception_host: "10.10.10.103"
  goinception_port: 4000
  goinception_backup: true

# CI/CD（字典 cicd_* 优先覆盖下列 YAML）
cicd:
  enabled: true
  jenkins:
    base_url: "http://10.10.10.103:8080"
    username: "admin"
    api_token: ""
    job_folder: ""
  jenkinsfile:
    repo: git@gitee.com:wxd_ops/jenkinsfile-new.git
    branch: main
    front: front.jenkinsfile
    backend: backend.jenkinsfile
    k8s: cigroovy.jenkinsfile
    shared_library_name: jenkins_share_libraries
  minio:
    endpoint: http://10.10.10.103:9000
    bucket_frontend: frontend-artifacts
    bucket_backend: backend-artifacts
  harbor:
    url: harbor.deploy.local
    host_ip: 10.10.10.103
    project_group: registry
    # username/password 也可在数据字典 cicd_harbor_username / cicd_harbor_password 配置
  # 与Jenkins中的凭据ID一致
  credentials:
    git: gitee_registry_ssh
    ssh_deploy: target-server-credential
    minio: minio-credentials
    harbor: HARBOR_ID
  run_sync_interval_seconds: 15
  default_wait_mins: 60
  default_artifact_retain_count: 10
  # 审批超时时间
  approval_sla_hours: 24
  # 审批提醒间隔时间
  approval_reminder_interval_hours: 4

http:
  read_header_timeout_seconds: 5
  read_timeout_seconds: 0
  write_timeout_seconds: 0
  idle_timeout_seconds: 120

log:
  level: debug
  format: text
  output: both  # console, file, both
  file_path: ./logs  # log file directory path

mysql:
  driver: mysql              # mysql（默认）或 postgres
  host: 10.10.10.103        # Docker 服务名，容器内部通信
  port: 3306
  user: root
  password: "0gvzJr66iNs5"  # 生产环境务必修改，勿提交真实密码
  db_name: yunshu
  charset: utf8mb4
  loc: Asia%2FShanghai
  max_idle_conns: 5          # 降低以节省内存
  max_open_conns: 20         # 降低以节省内存
  conn_max_lifetime_seconds: 3600

# PostgreSQL 示例（与 mysql 二选一；也可用 database: 键，见 .codegraph/kite-comparison.md）
# database:
#   driver: postgres
#   host: 127.0.0.1
#   port: 5432
#   user: yunshu
#   password: secret
#   db_name: yunshu
#   sslmode: disable
#   timezone: Asia/Shanghai
#   max_idle_conns: 5
#   max_open_conns: 20
#   conn_max_lifetime_seconds: 3600

redis:
  addr: 10.10.10.103:6379    # Docker 服务名，容器内部通信
  password: "1234"  # 生产环境务必修改
  db: 0
  pool_size: 10              # 降低以节省内存

# mail：数据字典 mail_* 优先，下列 YAML 仅作兜底（发信时每次从字典读取，改字典无需重启）
# 字典项：mail_host / mail_port / mail_username / mail_password / mail_from_email / mail_from_name / mail_use_tls
# mail:
#   host: smtp.163.com
#   port: 465
#   username: "rootwxd@163.com"
#   password: "YOUR_163_AUTH_CODE"
#   from_email: rootwxd@163.com
#   from_name: YunShu CMDB
#   use_tls: true

auth:
  jwt_secret: "YunshuJWTSecretKey2026MustBeAtLeast32BytesLong!!"  # 生产环境务必修改，至少32字节
  access_token_ttl_minutes: 120
  email_code_ttl_seconds: 600
  email_code_cooldown_seconds: 60

casbin:
  model_path: configs/casbin_model.conf

swagger:
  enabled: true
  path: /swagger

security:
  # 32 bytes key for encrypting sensitive data (base64 recommended)
  encryption_key: "change-me-32bytes-base64"

# 日志检索（Loggie 采集 → Elasticsearch，Yunshu 代理查询）
elasticsearch:
  enabled: false
  addresses:
    - "http://127.0.0.1:9200"
  username: ""
  password: ""
  index_pattern: "yunshu-agent-*"
  # Loggie Agent 一键安装：远端 wget/curl 拉取二进制的 URL（可含 {arch} 占位，如 amd64/arm64）
  # binary_url 配在 loggie 段，见下方 loggie.binary_url
  message_fields: ["message", "body", "log", "content"]
  timestamp_field: "@timestamp"
  default_size: 100
  max_size: 1000
  timeout_seconds: 30
  default_retention_days: 30
  cleanup_cron_spec: "0 3 * * *"   # 每天 03:00 清理过期索引

# Loggie Agent（目标机二进制安装 / systemd）
loggie:
  binary_url: ""   # 例: https://github.com/loggie-io/loggie/releases/download/v1.5.0/loggie_linux_{arch}.tar.gz
  unit_name: "loggie.service"
  deploy_dir: "/export/loggie"

# 下列键的常见取值可在「系统 → 数据字典」中按类型选用，便于团队统一录入（如 config_yaml_mysql_host、alert_enrich_prometheus_url、k8s_kubeconfig_template 等）。
alert:
  # 以下 3 项已收敛为“数据字典优先，YAML 兜底”：
  # - alert_webhook_token
  # - alert_enrich_prometheus_url
  # - alert_enrich_prometheus_token
  #
  # 若你已在数据字典中启用并配置，可继续保持注释状态；
  # 若需临时回退 YAML，可取消注释并填写。
  # webhook_token: "change-me-alert-token"
  # 告警通道默认超时（毫秒），当通道未显式填写 timeout_ms 时生效
  default_timeout_ms: 5000
  # 告警事件请求/响应体最大落库存储长度
  max_payload_chars: 8000
  # 指纹去重缓存 TTL（秒）
  dedup_ttl_seconds: 86400
  # group_key 聚合维度（用于服务端收敛/聚合）
  group_by: ["alertname", "cluster", "namespace", "severity", "receiver"]
  # 通知合并 digest：在 group_by 之外区分具体对象（内存/CPU/磁盘等不同告警共用 group_by，靠 instance 等区分）
  digest_by: ["instance", "pod", "node", "host", "device", "job"]
  # group 第一次发送前等待窗口（秒）：用于“先收集后发送”（对齐 Alertmanager/夜莺 group_wait）
  group_wait_seconds: 15
  # group 已发送后，若有“新变化”（labelsDigest变化）再次发送的最小间隔（秒）（对齐 group_interval）
  group_interval_seconds: 60
  # group 持续 firing 且无新变化时的重复提醒间隔（秒）（对齐 repeat_interval）
  repeat_interval_seconds: 300
  # 外部 Alertmanager Webhook（入口 A）是否跳过 Yunshu 第二层 group timing（默认 true，信任 AM 原生聚合）
  # 平台监控规则（入口 B / receiver=platform-monitor）始终使用上述 group_* 配置，不受此项影响
  webhook_skip_group_timing: true
  # group_key 状态在 Redis 中过期时间（秒）
  aggregate_ttl_seconds: 86400
  # 平台消息长度限制（字符数，按 rune 计算；默认值偏保守，避免钉钉/企微超限）
  platform_limits:
    dingding_max_chars: 4500
    wecom_max_chars: 3500
    generic_max_chars: 8000
  # Prometheus 地址（用于从 generatorURL 中解析表达式并查询当前值）
  # prometheus_url: "http://10.10.10.103:9091"
  # Prometheus Bearer Token（无则留空）
  # prometheus_token: ""
  # Prometheus 查询超时（秒）
  prom_query_timeout_seconds: 5
  # P3异步增强开关：开启后，通知主链路不阻塞Prometheus查询
  prometheus_enrich_enabled: true
  # Prometheus异步增强队列长度
  prometheus_enrich_queue_size: 1024
  # Prometheus异步增强worker数量
  prometheus_enrich_workers: 4
  # Alertmanager Webhook：Redis 存在且未关闭异步时，鉴权通过后先入队由后台 worker 消费（HTTP 快速返回）。
  webhook_async_disabled: false
  webhook_queue_max_len: 10000
  # 多副本时仅一个实例跑内置 PromQL 监控规则 tick 的全局锁 TTL（秒）。应大于单轮评估最坏耗时。
  monitor_eval_leader_lock_seconds: 30
  # 仅内置 PromQL 监控规则的调度节拍（robfig/cron 六段式，含秒）。云到期规则在控制台配置 Cron，由服务内独立节拍轮询。空则默认 */5 * * * * *（每 5 秒）。
  # monitor_eval_cron_spec: "*/5 * * * * *"

# 多集群 K8s Event 转发：请在「数据字典」维护（字典优先，下列 YAML 兜底）；Normal 不转发，告警 labels 带集群 owning_project_id
# dict_type: k8s_event_forward_enabled | k8s_event_forward_watcher_buffer_size |
#            k8s_event_forward_worker_interval_seconds | k8s_event_forward_worker_batch_size |
#            k8s_event_forward_worker_max_retries
# 入站复用告警平台 POST /api/v1/alerts/webhook/alertmanager（鉴权同 alert_webhook_token）
k8s_event_forward:
  enabled: false
  watcher_buffer_size: 1000
  worker_interval_seconds: 10
  worker_batch_size: 50
  worker_max_retries: 3

# =========================
# 配置源收敛说明（建议）
# =========================
# 1) 启动必需项（必须来自 YAML / ENV）：
#    - app.*, http.*, grpc.*, log.*
#    - mysql.*, redis.*
#    - auth.*, casbin.*, swagger.*, security.*
#    - agent.register_secret
#
# 2) 运行期可运营项（数据字典优先，YAML 兜底）：
#    - mail.*                 -> mail_host / mail_port / mail_username / mail_password / mail_from_email / mail_from_name / mail_use_tls
#    - alert.webhook_token    -> alert_webhook_token
#    - alert.prometheus_url   -> alert_enrich_prometheus_url
#    - alert.prometheus_token -> alert_enrich_prometheus_token
#    - k8s_event_forward.*    -> k8s_event_forward_enabled / _watcher_buffer_size / _worker_*
#
# 3) 业务页面辅助选项（仅字典，不在 YAML 维护）：
#    - dingtalk_webhook_url / wecom_webhook_url / alert_webhook_url
#    - wecom_* / dingtalk_* / alert_promql_label_key / alert_threshold_unit 等