# =============================================================================
# Yunshu 主配置（唯一纳管入口）
# =============================================================================
# 日常部署 / Docker Compose / 裸机：只改本文件。无需 .env / .env.example。
# 环境变量仍可作为临时覆盖（viper），但不作为交付配置源。
#
# 密钥生成（上线前必做，与 DB 备份一同保管；更换后历史密文永久不可解）：
#   security.encryption_key ← openssl rand -base64 32
#   auth.jwt_secret         ← openssl rand -base64 48 | tr -d '+/='
#
# ---------- 场景速查（改哪些）----------
# Docker Compose（本仓库 docker-compose.yml）：
#   1) mysql.host          → 宿主机 IP（旧 compose 无 host-gateway；常用 172.17.0.1）
#   2) mysql.password      → 与宿主机 MySQL 一致
#   3) redis.addr          → yunshu-redis:6379
#   4) redis.password      → 与 compose 里 redis --requirepass 完全一致
#   5) auth.jwt_secret / security.encryption_key → 上式 openssl 生成
#   6) app.env             → 联调可先 dev；正式上线改 prod（prod 拒绝占位/弱密钥）
#
# 裸机 / 本机 go run：
#   mysql.* / redis.* 指向本机或内网地址；密钥同上。
#
# ---------- 可选能力何时打开 ----------
# plugins.enabled      裁剪业务模块；列表为空 = 启用默认全集
# ai.enabled           需要 AI 助手 / 模型调用时改为 true，并填 api_key
# cicd.enabled         对接 Jenkins / Harbor / MinIO 发布流水线时
# elasticsearch.enabled  Loggie→ES 日志检索；需 ES 可达
# kafka.enabled        日志经 Kafka 中转再写 ES；false 时 Loggie 可直写 ES
# swagger.enabled      仅开发/联调；生产保持 false
# dbmgmt.goinception_* 需要 SQL 审核/执行时开启并填 goinception 地址
# alert.prometheus_*   需要从 Prometheus 富化告警当前值时
# k8s_event_forward.*  多集群 Event 转发入站；也可用数据字典覆盖
#
# ---------- 配置优先级 ----------
# 启动必需：app / http / log / mysql|database / redis / auth / security（本文件）
# 运行期运营：mail / auth / alert.webhook_token / prometheus / k8s_event_forward → 数据字典优先
# =============================================================================

app:
  name: yunshu-cmdb
  # dev|test：占位密钥仅告警；prod|production：弱密钥/仓库占位值直接拒绝启动
  env: dev
  port: 8080

# 业务插件（GVA 风格）：按需启停模块；空 enabled 表示启用默认全集。
# 裁剪示例：不需要 CI/CD 时从列表去掉 cicd；不需要 AI 时去掉 ai（并保持 ai.enabled=false）。
plugins:
  enabled:
    - core
    - k8s
    - alert
    - project
    - cmdb
    - backup
    - cicd
    - dbmgmt
    - inspect
    - ai
    - esmgmt

# AI：ai.enabled=true 且 plugins 含 ai 时路由/Worker 才生效；密钥优先用数据字典 ai_* 覆盖
ai:
  enabled: false
  default_provider: openai_compat
  timeout_sec: 60
  max_tokens: 2048
  openai:
    base_url: "https://api.openai.com/v1"
    api_key: ""
    model: "gpt-4o-mini"
  deepseek:
    base_url: "https://api.deepseek.com/v1"
    api_key: ""
    model: "deepseek-chat"
  anthropic:
    base_url: "https://api.anthropic.com"
    api_key: ""
    model: "claude-sonnet-4-20250514"

# 数据库管理：plugins 含 dbmgmt 时启用；goinception 不可达时可设 goinception_enabled=false（仅直连能力）
dbmgmt:
  query_timeout_seconds: 30
  max_result_rows: 1000
  max_import_file_mb: 10
  prod_force_approval: true
  forbid_self_approve: true
  approval_sla_hours: 24
  approval_reminder_interval_hours: 4
  allowed_drivers: [mysql, postgres]
  ping_interval_seconds: 300
  max_concurrent_per_instance: 5
  goinception_enabled: true
  goinception_host: "10.10.10.103"
  goinception_port: 4000
  goinception_backup: true

# CI/CD：plugins 含 cicd 且本段 enabled=true 时启用；未接 Jenkins 时可 enabled=false
# 凭据也可在数据字典 cicd_* / cicd_harbor_* 覆盖，改字典无需重启部分项
cicd:
  enabled: true
  jenkins:
    base_url: "http://10.10.10.103:8080"
    username: "admin"
    api_token: ""
    job_folder: ""
  jenkinsfile:
    repo: git@gitee.com:wxd_ops/jenkinsfile-new.git
    branch: main
    front: front.jenkinsfile
    backend: backend.jenkinsfile
    k8s: cigroovy.jenkinsfile
    shared_library_name: jenkins_share_libraries
  minio:
    endpoint: http://10.10.10.103:9000
    bucket_frontend: frontend-artifacts
    bucket_backend: backend-artifacts
  harbor:
    url: harbor.deploy.local
    host_ip: 10.10.10.103
    project_group: registry
    # username/password 也可在数据字典 cicd_harbor_username / cicd_harbor_password 配置
  # 与Jenkins中的凭据ID一致
  credentials:
    git: gitee_registry_ssh
    ssh_deploy: target-server-credential
    minio: minio-credentials
    harbor: HARBOR_ID
  run_sync_interval_seconds: 15
  default_wait_mins: 60
  default_artifact_retain_count: 10
  # 禁止审批人审批自己提交的发布（职责分离）
  forbid_self_approve: true
  # 生产环境发布须留痕审计（无审批流时拒绝直发）
  prod_force_audit: true
  # 审批超时时间
  approval_sla_hours: 24
  # 审批提醒间隔时间
  approval_reminder_interval_hours: 4
  # SonarQube（优先用数据字典 cicd_sonar_* 开关控制）
  sonar:
    enabled: false
    url: ""
    token: ""
    gate_block: true
  callback:
    hmac_secret: ""
    callback_url: ""

http:
  read_header_timeout_seconds: 5
  read_timeout_seconds: 0
  write_timeout_seconds: 0
  idle_timeout_seconds: 120

log:
  level: debug
  format: text
  output: both  # console, file, both
  file_path: ./logs  # log file directory path
  max_size_mb: 100   # 单文件上限（MB），超出后轮转
  max_age_days: 30   # 保留天数
  max_backups: 10    # 保留备份文件数
  compress: true     # 轮转后 gzip 压缩

mysql:
  driver: mysql              # mysql（默认）或 postgres
  # 裸机：内网 IP；Docker Compose 连宿主机 MySQL：改为 172.17.0.1 或宿主机实际 IP
  host: 10.10.10.103
  port: 3306
  user: root
  password: "0gvzJr66iNs5"  # 生产务必修改；勿把真实生产密码提交到公共仓库
  db_name: yunshu
  charset: utf8mb4
  loc: Asia%2FShanghai
  max_idle_conns: 5
  max_open_conns: 20
  conn_max_lifetime_seconds: 3600
  # auto_migrate: 未配置时按环境推断（非 prod 开 / prod 关）。生产请保持关，用 migrate 子命令。
  # auto_migrate: false

# PostgreSQL 示例（与 mysql 二选一；也可用顶层 database: 键）
# database:
#   driver: postgres
#   host: 127.0.0.1
#   port: 5432
#   user: yunshu
#   password: secret
#   db_name: yunshu
#   sslmode: disable
#   timezone: Asia/Shanghai

redis:
  # 裸机：host:port；Docker Compose：必须改为 yunshu-redis:6379
  addr: 10.10.10.103:6379
  # 必须与 docker-compose.yml 中 redis --requirepass 一致（Compose 默认见该文件注释）
  password: "1234"
  db: 0
  pool_size: 10

# mail：数据字典 mail_* 优先，下列 YAML 仅作兜底（发信时每次从字典读取，改字典无需重启）
# 字典项：mail_host / mail_port / mail_username / mail_password / mail_from_email / mail_from_name / mail_use_tls
# mail:
#   host: smtp.163.com
#   port: 465
#   username: "rootwxd@163.com"
#   password: "YOUR_163_AUTH_CODE"
#   from_email: rootwxd@163.com
#   from_name: YunShu CMDB
#   use_tls: true

auth:
  # 数据字典 auth_* 优先，下列 YAML 仅作兜底（改字典后需重启进程生效）
  # 字典项：auth_jwt_secret / auth_access_token_ttl_minutes / auth_refresh_token_ttl_hours /
  #         auth_cookie_secure / auth_cookie_domain / auth_csp_enabled /
  #         auth_email_code_ttl_seconds / auth_email_code_cooldown_seconds /
  #         auth_login_max_fail_attempts / auth_login_lock_seconds
  # 生成：openssl rand -base64 48 | tr -d '+/='；app.env=prod 时禁止使用下方仓库占位值
  jwt_secret: "YunshuJWTSecretKey2026MustBeAtLeast32BytesLong!!"
  access_token_ttl_minutes: 15   # 短 access；浏览器 HttpOnly Cookie（ys_at）
  refresh_token_ttl_hours: 168   # 7 天 refresh（ys_rt）；Redis 一次性轮换
  cookie_secure: false           # 本地 http；生产 HTTPS 改为 true（或 app.env=prod 时默认 Secure）
  # cookie_domain: ""            # 同域反代留空
  csp_enabled: true
  email_code_ttl_seconds: 600
  email_code_cooldown_seconds: 60
  # login_max_fail_attempts: 5
  # login_lock_seconds: 900

casbin:
  model_path: configs/casbin_model.conf
  # 多副本：定时从 DB 重载策略（秒）。0=默认 30s；负数=关闭（单副本可关）
  auto_load_interval_seconds: 30

swagger:
  # 仅开发/联调打开；生产务必 false（勿对公网暴露）
  enabled: false
  path: /swagger

security:
  # 云账号 AK/SK、SSH、kubeconfig、ES 密码等 AES-GCM 密钥
  # 生成：openssl rand -base64 32（解码后须正好 32 字节）；或 32 字节原文
  # app.env=dev 时下方占位仅告警；app.env=prod 时必须换成强随机，否则拒绝启动
  # 警告：更换密钥后历史密文永久不可解——请与数据库备份一并保管
  encryption_key: "change-me-32bytes-base64"

# 日志检索：需要控制台查 Loggie 日志时 enabled=true，并保证 ES 可达
elasticsearch:
  enabled: false
  addresses:
    - "http://127.0.0.1:9200"
  username: ""
  password: ""
  index_pattern: "yunshu-agent-*"
  message_fields: ["message", "body", "log", "content"]
  timestamp_field: "@timestamp"
  default_size: 100
  max_size: 1000
  timeout_seconds: 90
  default_retention_days: 30
  cleanup_cron_spec: "0 3 * * *"   # 每天 03:00 清理过期索引

# Kafka：仅当日志管道需要「Loggie → Kafka → ES」时 enabled=true；false 时 Loggie 可直写 ES
kafka:
  enabled: false
  brokers:
    - "127.0.0.1:9092"
  topic_prefix: "yunshu-agent"   # Topic = yunshu-agent-{服务器IP}-YYYY.MM.DD（IP 中 . 转为 -）
  consumer_group: "yunshu-log-es"
  username: ""
  password: ""
  sasl_mechanism: ""
  batch_size: 200
  topic_partitions: 3
  workers: 1

# Loggie Agent（目标机离线二进制安装 / systemd）
loggie:
  # Yunshu 主机上的离线包（相对工作目录或绝对路径），安装时 SFTP 上传，不走在线下载
  offline_binary_path: "deploy/loggie/binary/loggie"
  unit_name: "loggie.service"
  deploy_dir: "/export/loggie"

# 下列键的常见取值可在「系统 → 数据字典」中按类型选用，便于团队统一录入（如 config_yaml_mysql_host、alert_enrich_prometheus_url、k8s_kubeconfig_template 等）。
alert:
  # 以下项数据字典优先，YAML 兜底：
  # - alert_webhook_token（现仅用于 K8s Event 等内部入站 POST /api/v1/alerts/ingress/k8s-events，不再对接 Alertmanager）
  # - alert_enrich_prometheus_url
  # - alert_enrich_prometheus_token
  #
  # 若你已在数据字典中启用并配置，可继续保持注释状态；
  # 若需临时回退 YAML，可取消注释并填写。
  # webhook_token: "change-me-alert-token"
  # 告警通道默认超时（毫秒），当通道未显式填写 timeout_ms 时生效
  default_timeout_ms: 5000
  # 告警事件请求/响应体最大落库存储长度
  max_payload_chars: 8000
  # 指纹去重缓存 TTL（秒）
  dedup_ttl_seconds: 86400
  # group_key 聚合维度（用于服务端收敛/聚合）
  group_by: ["alertname", "cluster", "namespace", "severity", "receiver"]
  # 通知合并 digest：在 group_by 之外区分具体对象（内存/CPU/磁盘等不同告警共用 group_by，靠 instance 等区分）
  digest_by: ["instance", "pod", "node", "host", "device", "job"]
  # group 第一次发送前等待窗口（秒）：用于“先收集后发送”（对齐夜莺 group_wait）
  group_wait_seconds: 15
  # group 已发送后，若有“新变化”（labelsDigest变化）再次发送的最小间隔（秒）
  group_interval_seconds: 60
  # group 持续 firing 且无新变化时的重复提醒间隔（秒）
  repeat_interval_seconds: 300
  # 历史字段：外部 AM 已下线；平台规则与 K8s 入站使用上述 group_*（K8s 批次可按源跳过）
  webhook_skip_group_timing: true
  # group_key 状态在 Redis 中过期时间（秒）
  aggregate_ttl_seconds: 86400
  # 平台消息长度限制（字符数，按 rune 计算；默认值偏保守，避免钉钉/企微超限）
  platform_limits:
    dingding_max_chars: 4500
    wecom_max_chars: 3500
    generic_max_chars: 8000
  # Prometheus 地址（用于从 generatorURL 中解析表达式并查询当前值）
  # prometheus_url: "http://10.10.10.103:9091"
  # Prometheus Bearer Token（无则留空）
  # prometheus_token: ""
  # Prometheus 查询超时（秒）
  prom_query_timeout_seconds: 5
  # P3异步增强开关：开启后，通知主链路不阻塞Prometheus查询
  prometheus_enrich_enabled: true
  # Prometheus异步增强队列长度
  prometheus_enrich_queue_size: 1024
  # Prometheus异步增强worker数量
  prometheus_enrich_workers: 4
  # K8s Event 内部入站：Redis 存在且未关闭异步时先入队由后台 worker 消费
  webhook_async_disabled: false
  webhook_queue_max_len: 10000
  # 多副本时仅一个实例跑内置 PromQL 监控规则 tick 的全局锁 TTL（秒）。应大于单轮评估最坏耗时。
  monitor_eval_leader_lock_seconds: 30
  # 仅内置 PromQL 监控规则的调度节拍（robfig/cron 六段式，含秒）。云到期规则在控制台配置 Cron，由服务内独立节拍轮询。空则默认 */5 * * * * *（每 5 秒）。
  # monitor_eval_cron_spec: "*/5 * * * * *"

# 多集群 K8s Event 转发：需要 Event→告警入站时 enabled=true（字典 k8s_event_forward_* 优先）
# 入站：POST /api/v1/alerts/ingress/k8s-events；样例见 deploy/monitoring/k8s_event_forward
k8s_event_forward:
  enabled: false
  watcher_buffer_size: 1000
  worker_interval_seconds: 10
  worker_batch_size: 50
  worker_max_retries: 3

# =========================
# 配置源分工（勿再维护 .env.example）
# =========================
# 1) 本文件：启动必需项与默认值（app/http/log/mysql/redis/auth/security/plugins/…）
# 2) 数据字典优先、YAML 兜底：mail_*、alert_webhook_token、alert_enrich_prometheus_*、k8s_event_forward_*
# 3) 仅字典：钉钉/企微 Webhook、告警录入辅助项等页面运营配置
# 4) 可选环境变量：仅运维临时覆盖（如 MYSQL_HOST），不作为交付清单