<style>
  .pdf-export-btn {
    position: fixed; right: 20px; bottom: 20px; z-index: 9999;
    padding: 10px 18px; border: none; border-radius: 8px;
    background: linear-gradient(135deg, #0f766e, #0e7490); color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 14px rgba(15, 118, 110, 0.35);
  }
  .pdf-export-btn:disabled { opacity: 0.65; cursor: wait; }
  @media print { .pdf-export-btn { display: none !important; } }
</style>
<button type="button" class="pdf-export-btn" id="yunshuPdfBtn">下载 PDF</button>
<script>
(function () {
  var PDF_LIB_BASE = "__PDF_LIB_BASE__";
  var UPLOAD_URL = "__UPLOAD_URL__";
  var PDF_LIBS = {
    html2canvas: [
      PDF_LIB_BASE + "/html2canvas.min.js",
      "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js",
      "https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"
    ],
    jspdf: [
      PDF_LIB_BASE + "/jspdf.umd.min.js",
      "https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js",
      "https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"
    ]
  };

  function loadScript(urls) {
    return new Promise(function (resolve, reject) {
      if (typeof urls[0] === "string" && urls[0].indexOf("html2canvas") >= 0 && typeof html2canvas !== "undefined") return resolve();
      if (typeof urls[0] === "string" && urls[0].indexOf("jspdf") >= 0 && window.jspdf) return resolve();
      var i = 0;
      function next() {
        if (i >= urls.length) return reject(new Error("PDF 库加载失败"));
        var s = document.createElement("script");
        s.src = urls[i++];
        s.onload = function () { resolve(); };
        s.onerror = next;
        document.head.appendChild(s);
      }
      next();
    });
  }

  function waitReady() {
    return new Promise(function (resolve) {
      function go() {
        var jobs = [document.fonts && document.fonts.ready ? document.fonts.ready.catch(function () {}) : Promise.resolve()];
        Array.prototype.forEach.call(document.images, function (img) {
          if (!img.complete) jobs.push(new Promise(function (r) { img.onload = img.onerror = r; }));
        });
        Promise.all(jobs).then(function () {
          setTimeout(function () {
            requestAnimationFrame(function () { requestAnimationFrame(resolve); });
          }, 500);
        });
      }
      if (document.readyState === "complete") go();
      else window.addEventListener("load", go, { once: true });
    });
  }

  function capturePdfBlob() {
    var target = document.querySelector(".page") || document.body;
    var width = Math.max(target.scrollWidth, target.clientWidth, 960);
    var height = Math.max(target.scrollHeight, target.clientHeight, 400);
    var origBody = document.body.style.cssText;
    var origHtml = document.documentElement.style.cssText;
    document.body.style.backgroundColor = "#ffffff";
    document.documentElement.style.backgroundColor = "#ffffff";
    return html2canvas(target, {
      scale: 1.5,
      useCORS: true,
      logging: false,
      backgroundColor: "#ffffff",
      width: width,
      height: height,
      windowWidth: width,
      windowHeight: height,
      scrollX: 0,
      scrollY: 0,
      foreignObjectRendering: false,
      onclone: function (doc) {
        var b = doc.body, h = doc.documentElement, p = doc.querySelector(".page");
        if (b) { b.style.backgroundColor = "#fff"; b.style.visibility = "visible"; }
        if (h) { h.style.backgroundColor = "#fff"; }
        if (p) { p.style.backgroundColor = "#fff"; p.style.maxWidth = "none"; }
      }
    }).then(function (canvas) {
      document.body.style.cssText = origBody;
      document.documentElement.style.cssText = origHtml;
      if (!canvas.width || !canvas.height) throw new Error("截图失败");
      var jsPDF = window.jspdf.jsPDF;
      var pdf = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
      var pageW = 297, pageH = 210, imgW = pageW;
      var imgH = (canvas.height * imgW) / canvas.width;
      var pages = Math.max(1, Math.ceil(imgH / pageH));
      for (var page = 0; page < pages; page++) {
        if (page > 0) pdf.addPage();
        var sy = (canvas.height / pages) * page;
        var sh = Math.min(canvas.height / pages, canvas.height - sy);
        var tmp = document.createElement("canvas");
        tmp.width = canvas.width;
        tmp.height = sh;
        tmp.getContext("2d").drawImage(canvas, 0, sy, canvas.width, sh, 0, 0, canvas.width, sh);
        var data = tmp.toDataURL("image/jpeg", 0.92);
        var ph = (sh * imgW) / canvas.width;
        pdf.addImage(data, "JPEG", 0, 0, imgW, ph);
      }
      return pdf.output("blob");
    }).catch(function (e) {
      document.body.style.cssText = origBody;
      document.documentElement.style.cssText = origHtml;
      throw e;
    });
  }

  function pdfFileName() {
    var t = document.title || "inspect-report";
    var base = t.replace(/\s*[—-]\s*运维巡检报告.*$/i, "").trim() || "inspect-report";
    return base.replace(/[^\w\u4e00-\u9fa5-]+/g, "_") + "_巡检报告.pdf";
  }

  function uploadPdf(blob, filename) {
    if (!UPLOAD_URL || UPLOAD_URL.indexOf("__") >= 0) return Promise.resolve();
    var fd = new FormData();
    fd.append("pdf", blob, filename);
    var headers = {};
    try {
      var t = localStorage.getItem("permission-system-token");
      if (t) headers.Authorization = "Bearer " + t;
    } catch (e) {}
    return fetch(UPLOAD_URL, { method: "POST", body: fd, headers: headers }).then(function (r) {
      if (!r.ok) throw new Error("PDF 上传失败");
    });
  }

  function downloadBlob(blob, filename) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  }

  function runExport(btn) {
    if (btn) { btn.disabled = true; btn.textContent = "正在生成 PDF…"; }
    var filename = pdfFileName();
    return Promise.all([loadScript(PDF_LIBS.html2canvas), loadScript(PDF_LIBS.jspdf)])
      .then(waitReady)
      .then(capturePdfBlob)
      .then(function (blob) {
        downloadBlob(blob, filename);
        return uploadPdf(blob, filename).catch(function () {});
      })
      .finally(function () {
        if (btn) { btn.disabled = false; btn.textContent = "下载 PDF"; }
      });
  }

  var btn = document.getElementById("yunshuPdfBtn");
  if (btn) btn.addEventListener("click", function () {
    runExport(btn).catch(function (e) { alert((e && e.message) || "PDF 生成失败"); });
  });

  var params = new URLSearchParams(window.location.search);
  if (params.get("generatePDF") === "true" || params.get("autoGenerate") === "true") {
    runExport(btn).catch(function (e) { console.error("[PDF]", e); });
  }
})();
</script>
