{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "service-base.fullname" . }}
  labels:
    {{- include "service-base.labels" . | nindent 4 }}
spec:
  type: {{ .Values.type }}
  ports:
    {{- if .Values.ports }}
    {{- range .Values.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort | default .name }}
      protocol: {{ .protocol | default "TCP" }}
      {{- if and (eq $.Values.type "NodePort") .nodePort }}
      nodePort: {{ .nodePort }}
      {{- end }}
    {{- end }}
    {{- else }}
    - port: {{ .Values.port }}
      targetPort: {{ .Values.targetPort | default "http" }}
      protocol: TCP
      name: http
      {{- if and (eq .Values.type "NodePort") .Values.nodePort }}
      nodePort: {{ .Values.nodePort }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "service-base.selectorLabels" . | nindent 4 }}
{{- end }}
