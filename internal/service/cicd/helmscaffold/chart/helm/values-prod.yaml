deployment-base:
  replicaCount: 3
  probes:
    enabled: true
  lifecycle:
    preStop:
      exec:
        command: ["/bin/sh", "-c", "sleep 15"]
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  consulRegister:
    enabled: true
    mode: catalog
  # 生产开启 SkyWalking 时改为 true，并改成你们 Harbor 上的 agent 镜像 / OAP 地址
  skywalking:
    enabled: false
    collectorBackendServices: "skywalking-oap.observability:11800"
hpa-base:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
