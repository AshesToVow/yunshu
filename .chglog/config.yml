style: github
template: CHANGELOG.tpl
info:
  title: CHANGELOG
  repository_url: https://github.com/your-org/yunshu
options:
  commits:
    filters:
      Type:
        - feat
        - fix
        - perf
        - refactor
        - docs
        - ci
        - build
        - test
        - chore
        - revert
  commit_groups:
    title_maps:
      feat: 新功能
      fix: 修复
      perf: 性能
      refactor: 重构
      docs: 文档
      ci: CI 与工程化
      build: 构建
      test: 测试
      chore: 杂项
      revert: 回滚
  header:
    pattern: "^(\\w*)(?:\\(([\\w\\$\\.\\-\\*\\s]*)\\))?\\:\\s(.*)$"
    pattern_maps:
      - Type
      - Scope
      - Subject
  notes:
    keywords:
      - BREAKING CHANGE
