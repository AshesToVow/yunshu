basePath: /
definitions:
  alert.AlertManagerAlert:
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      endsAt:
        type: string
      fingerprint:
        type: string
      generatorURL:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      startsAt:
        type: string
      status:
        type: string
    type: object
  handler.MessageData:
    properties:
      message:
        example: success
        type: string
    type: object
  handler.PermissionPageData:
    properties:
      list:
        items:
          $ref: '#/definitions/service.PermissionItem'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 10
        type: integer
      total:
        example: 1
        type: integer
    type: object
  handler.RolePageData:
    properties:
      list:
        items:
          $ref: '#/definitions/service.RoleItem'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 10
        type: integer
      total:
        example: 1
        type: integer
    type: object
  handler.UserPageData:
    properties:
      list:
        items:
          $ref: '#/definitions/service.UserDetailResponse'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 10
        type: integer
      total:
        example: 1
        type: integer
    type: object
  handler.idsRequest:
    properties:
      ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - ids
    type: object
  model.AlertSubscriptionNode:
    properties:
      children:
        items:
          $ref: '#/definitions/model.AlertSubscriptionNode'
        type: array
      code:
        type: string
      continue:
        description: 路由行为
        type: boolean
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      level:
        type: integer
      match_labels:
        additionalProperties:
          type: string
        description: 非数据库字段
        type: object
      match_labels_json:
        description: 匹配条件（与父节点条件AND组合）
        type: string
      match_regex:
        additionalProperties:
          type: string
        type: object
      match_regex_json:
        type: string
      match_severity:
        type: string
      name:
        description: 节点名称与标识
        type: string
      notify_resolved:
        type: boolean
      parent:
        $ref: '#/definitions/model.AlertSubscriptionNode'
      parent_id:
        description: 树形结构
        type: integer
      path:
        type: string
      project_id:
        type: integer
      receiver_group_ids:
        items:
          type: integer
        type: array
      receiver_group_ids_json:
        description: 通知配置
        type: string
      silence_seconds:
        type: integer
      updated_at:
        type: string
    type: object
  response.Body:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  service.AlertInhibitionRuleUpsertRequest:
    properties:
      description:
        type: string
      duration_seconds:
        type: integer
      enabled:
        type: boolean
      equal_labels_json:
        type: string
      name:
        maxLength: 128
        type: string
      priority:
        type: integer
      project_id:
        type: integer
      source_match_labels_json:
        type: string
      source_match_regex_json:
        type: string
      target_match_labels_json:
        type: string
      target_match_regex_json:
        type: string
    required:
    - name
    type: object
  service.AlertManagerPayload:
    properties:
      alerts:
        items:
          $ref: '#/definitions/alert.AlertManagerAlert'
        type: array
      commonAnnotations:
        additionalProperties:
          type: string
        type: object
      commonLabels:
        additionalProperties:
          type: string
        type: object
      externalURL:
        type: string
      groupLabels:
        additionalProperties:
          type: string
        type: object
      receiver:
        type: string
      status:
        type: string
      truncatedAlerts:
        type: integer
      version:
        type: string
    type: object
  service.AlertSubscriptionNodeUpsertRequest:
    properties:
      code:
        maxLength: 64
        type: string
      continue:
        type: boolean
      enabled:
        type: boolean
      match_labels_json:
        type: string
      match_regex_json:
        type: string
      match_severity:
        maxLength: 128
        type: string
      name:
        maxLength: 128
        type: string
      notify_resolved:
        type: boolean
      parent_id:
        type: integer
      project_id:
        type: integer
      receiver_group_ids_json:
        type: string
      silence_seconds:
        type: integer
    required:
    - name
    - project_id
    type: object
  service.ChangePasswordRequest:
    properties:
      new_password:
        maxLength: 64
        minLength: 6
        type: string
      old_password:
        maxLength: 64
        minLength: 6
        type: string
    required:
    - new_password
    - old_password
    type: object
  service.CreateWSTicketRequest:
    properties:
      scope:
        maxLength: 32
        type: string
    type: object
  service.EmailLoginRequest:
    properties:
      code:
        type: string
      email:
        maxLength: 128
        type: string
    required:
    - code
    - email
    type: object
  service.LoginRequest:
    properties:
      captcha_key:
        type: string
      code:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - captcha_key
    - code
    - password
    - username
    type: object
  service.LoginResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/system.UserDetailResponse'
    type: object
  service.PermissionCreateRequest:
    properties:
      action:
        maxLength: 32
        type: string
      description:
        maxLength: 255
        type: string
      k8s_scope_enabled:
        type: boolean
      name:
        maxLength: 64
        type: string
      resource:
        maxLength: 191
        type: string
    required:
    - action
    - name
    - resource
    type: object
  service.PermissionItem:
    properties:
      action:
        type: string
      description:
        type: string
      id:
        type: integer
      k8s_scope_enabled:
        type: boolean
      name:
        type: string
      resource:
        type: string
    type: object
  service.PermissionUpdateRequest:
    properties:
      action:
        maxLength: 32
        type: string
      description:
        maxLength: 255
        type: string
      k8s_scope_enabled:
        type: boolean
      name:
        maxLength: 64
        type: string
      resource:
        maxLength: 191
        type: string
    type: object
  service.PolicyGrantRequest:
    properties:
      permission_id:
        type: integer
      role_id:
        type: integer
    required:
    - permission_id
    - role_id
    type: object
  service.PolicyItemResponse:
    properties:
      action:
        type: string
      permission_id:
        type: integer
      permission_name:
        type: string
      resource:
        type: string
      role_code:
        type: string
      role_id:
        type: integer
      role_name:
        type: string
    type: object
  service.RegisterRequest:
    properties:
      code:
        type: string
      email:
        maxLength: 128
        type: string
      nickname:
        maxLength: 128
        type: string
      password:
        maxLength: 64
        minLength: 6
        type: string
      username:
        maxLength: 64
        minLength: 3
        type: string
    required:
    - code
    - email
    - nickname
    - password
    - username
    type: object
  service.RegisterResponse:
    properties:
      message:
        type: string
      user:
        $ref: '#/definitions/system.UserDetailResponse'
    type: object
  service.RoleCreateRequest:
    properties:
      code:
        maxLength: 64
        type: string
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 64
        type: string
      status:
        type: integer
    required:
    - code
    - name
    type: object
  service.RoleItem:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      status:
        type: integer
      updated_at:
        type: string
    type: object
  service.RoleUpdateRequest:
    properties:
      code:
        maxLength: 64
        type: string
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 64
        type: string
      status:
        type: integer
    type: object
  service.SendEmailCodeRequest:
    properties:
      email:
        maxLength: 128
        type: string
      scene:
        enum:
        - login
        - register
        type: string
    required:
    - email
    - scene
    type: object
  service.SendEmailCodeResponse:
    properties:
      cooldown_in:
        type: integer
      email:
        type: string
      expires_in:
        type: integer
      scene:
        type: string
    type: object
  service.SendLoginCodeByUsernameRequest:
    properties:
      username:
        type: string
    required:
    - username
    type: object
  service.SendPasswordLoginCodeRequest:
    properties:
      username:
        type: string
    required:
    - username
    type: object
  service.SendPasswordLoginCodeResponse:
    properties:
      captcha_key:
        type: string
      cooldown_in:
        type: integer
      expires_in:
        type: integer
      image:
        type: string
    type: object
  service.UpdateProfileRequest:
    properties:
      email:
        maxLength: 128
        type: string
      nickname:
        maxLength: 128
        type: string
      phone:
        maxLength: 20
        type: string
    required:
    - nickname
    type: object
  service.UserAssignRolesRequest:
    properties:
      role_ids:
        items:
          type: integer
        type: array
    type: object
  service.UserCreateRequest:
    properties:
      department_id:
        type: integer
      email:
        maxLength: 128
        type: string
      nickname:
        maxLength: 128
        type: string
      password:
        maxLength: 64
        minLength: 6
        type: string
      phone:
        maxLength: 20
        type: string
      role_ids:
        items:
          type: integer
        type: array
      status:
        type: integer
      username:
        maxLength: 64
        minLength: 3
        type: string
    required:
    - email
    - nickname
    - password
    - username
    type: object
  service.UserDetailResponse:
    properties:
      created_at:
        type: string
      department_id:
        type: integer
      department_name:
        type: string
      email:
        type: string
      groups:
        items:
          $ref: '#/definitions/system.UserGroupBrief'
        type: array
      id:
        type: integer
      nickname:
        type: string
      phone:
        type: string
      roles:
        items:
          $ref: '#/definitions/system.RoleItem'
        type: array
      status:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  service.UserUpdateRequest:
    properties:
      department_id:
        type: integer
      email:
        maxLength: 128
        type: string
      nickname:
        maxLength: 128
        type: string
      password:
        maxLength: 64
        minLength: 6
        type: string
      phone:
        maxLength: 20
        type: string
      status:
        type: integer
    type: object
  service.WSTicketResponse:
    properties:
      expires_in:
        type: integer
      ticket:
        type: string
    type: object
  system.RoleItem:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      status:
        type: integer
      updated_at:
        type: string
    type: object
  system.UserDetailResponse:
    properties:
      created_at:
        type: string
      department_id:
        type: integer
      department_name:
        type: string
      email:
        type: string
      groups:
        items:
          $ref: '#/definitions/system.UserGroupBrief'
        type: array
      id:
        type: integer
      nickname:
        type: string
      phone:
        type: string
      roles:
        items:
          $ref: '#/definitions/system.RoleItem'
        type: array
      status:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  system.UserGroupBrief:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
info:
  contact: {}
  description: |-
    YunShu CMDB is an operations CMDB console built with Gin, MySQL, Redis, SMTP mail delivery, Casbin, Cobra and slog.
    Request an email verification code first, then login with email code or register a new account by email. Username/password login remains available as an admin fallback.
  title: YunShu CMDB API
  version: "1.0"
paths:
  /api/v1/alerts/inhibition-rules:
    get:
      description: 分页查询抑制规则。规则在入站 firing 时生效：源告警匹配后写入 Redis，目标告警匹配且 equal 标签一致则被抑制。
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 名称/描述关键词
        in: query
        name: keyword
        type: string
      - description: 是否启用
        in: query
        name: enabled
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 查询告警抑制规则列表
      tags:
      - alert-inhibition
    post:
      consumes:
      - application/json
      parameters:
      - description: 规则
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.AlertInhibitionRuleUpsertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 创建告警抑制规则
      tags:
      - alert-inhibition
  /api/v1/alerts/inhibition-rules/{id}:
    delete:
      parameters:
      - description: 规则 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 删除告警抑制规则
      tags:
      - alert-inhibition
    put:
      consumes:
      - application/json
      parameters:
      - description: 规则 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 规则
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.AlertInhibitionRuleUpsertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 更新告警抑制规则
      tags:
      - alert-inhibition
  /api/v1/alerts/inhibition-rules/refresh-cache:
    post:
      responses: {}
      summary: 刷新抑制规则内存缓存
      tags:
      - alert-inhibition
  /api/v1/alerts/subscriptions:
    get:
      consumes:
      - application/json
      description: 分页查询订阅树节点，支持按项目、父节点、关键词过滤
      parameters:
      - description: 项目ID
        in: query
        name: project_id
        required: true
        type: integer
      - description: 父节点ID，0表示根节点
        in: query
        name: parent_id
        type: integer
      - description: 关键词
        in: query
        name: keyword
        type: string
      - description: 是否启用
        in: query
        name: enabled
        type: boolean
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认20
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.Body'
      summary: 查询订阅树节点列表
      tags:
      - alert-subscription
    post:
      consumes:
      - application/json
      description: 创建新的订阅树节点
      parameters:
      - description: 节点信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.AlertSubscriptionNodeUpsertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AlertSubscriptionNode'
      summary: 创建订阅树节点
      tags:
      - alert-subscription
  /api/v1/alerts/subscriptions/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定订阅树节点（有子节点时无法删除）
      parameters:
      - description: 节点ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.Body'
      summary: 删除订阅树节点
      tags:
      - alert-subscription
    put:
      consumes:
      - application/json
      description: 更新指定订阅树节点
      parameters:
      - description: 节点ID
        in: path
        name: id
        required: true
        type: integer
      - description: 节点信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.AlertSubscriptionNodeUpsertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AlertSubscriptionNode'
      summary: 更新订阅树节点
      tags:
      - alert-subscription
  /api/v1/alerts/subscriptions/tree:
    get:
      consumes:
      - application/json
      description: 获取指定项目的完整订阅树结构（包含所有层级）
      parameters:
      - description: 项目ID
        in: query
        name: project_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.AlertSubscriptionNode'
            type: array
      summary: 获取完整订阅树
      tags:
      - alert-subscription
  /api/v1/alerts/webhook/alertmanager:
    post:
      consumes:
      - application/json
      description: Ingest Alertmanager notifications. Auth via header X-Alert-Token
        or Authorization Bearer (not query token).
      parameters:
      - description: Webhook token (preferred)
        in: header
        name: X-Alert-Token
        type: string
      - description: Alertmanager payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/service.AlertManagerPayload'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: bad request
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: invalid webhook token
          schema:
            $ref: '#/definitions/response.Body'
      summary: Receive Alertmanager webhook
      tags:
      - AlertsWebhook
  /api/v1/auth/email-login:
    post:
      consumes:
      - application/json
      description: Login with email and a 6-digit verification code delivered through
        SMTP and cached in Redis.
      parameters:
      - description: Email verification login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.EmailLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/service.LoginResponse'
              type: object
        "400":
          description: bad request
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: 无访问权限
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/response.Body'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Body'
      summary: Login with email verification code
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Login with username, password and verification code. This is kept
        as a fallback entry for administrators.
      parameters:
      - description: Password login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/service.LoginResponse'
              type: object
        "400":
          description: bad request
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: 未登录或登录已失效
          schema:
            $ref: '#/definitions/response.Body'
        "403":
          description: 无访问权限
          schema:
            $ref: '#/definitions/response.Body'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Body'
      summary: Login with password
      tags:
      - Auth
  /api/v1/auth/login-code:
    post:
      consumes:
      - application/json
      description: Send an email verification code to the user's registered email
        address for login.
      parameters:
      - description: Send login code by username request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.SendLoginCodeByUsernameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/service.SendEmailCodeResponse'
              type: object
        "400":
          description: bad request
          schema:
            $ref: '#/definitions/response.Body'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/response.Body'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Body'
      summary: Send login verification code by username
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Logout the current user by invalidating the current token.
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/handler.MessageData'
              type: object
        "401":
          description: 未登录或登录已失效
          schema:
            $ref: '#/definitions/response.Body'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Body'
