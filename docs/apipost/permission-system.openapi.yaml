components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authorization Bearer <access_token>
    alertWebhookToken:
      type: apiKey
      in: header
      name: X-Alert-Token
      description: Alertmanager Webhook 鉴权（与 config alert.webhook_token 一致）
  schemas:
    StandardResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          description: 成功时的载荷，结构因接口而异
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: HTTP 状态码镜像
          example: 401
        reason:
          type: string
        message:
          type: string
          description: 产品话术
        error_code:
          type: string
          description: 业务错误码（字符串形式的数字码）
          example: "10002"
        metadata:
          type: object
          additionalProperties: true
